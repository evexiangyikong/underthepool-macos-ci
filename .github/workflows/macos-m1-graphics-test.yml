name: macOS M1 graphical launch

on:
  workflow_dispatch:

jobs:
  test:
    name: Graphics / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15
          - macos-26

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: System and GPU
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SYSTEM ====="
          uname -m
          sw_vers

          echo
          echo "===== GPU / DISPLAY ====="
          system_profiler SPDisplaysDataType || true

          echo
          echo "===== WINDOW SERVER ====="
          pgrep -alf WindowServer || true

          test "$(uname -m)" = "arm64"

      - name: Download Demo
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$RUNNER_TEMP/demo.zip"

          curl -fL \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/demo-25544208/UnderThePool-notarization.zip" \
            -o "$ZIP"

          ACTUAL="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          EXPECTED="787f5b6214c4617fad8b9cac0f49156f6069132d9807af4ac4c10ae073525c4b"

          test "$ACTUAL" = "$EXPECTED"

          mkdir "$RUNNER_TEMP/demo"
          ditto -x -k "$ZIP" "$RUNNER_TEMP/demo"

      - name: Verify app
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/demo/UnderThePool.app"

          codesign --verify --deep --strict --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute -vvv "$APP"

      - name: Show available Godot drivers
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/demo/UnderThePool.app"

          EXEC="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist"
          )"

          BIN="$APP/Contents/MacOS/$EXEC"

          echo "===== DRIVER HELP ====="

          arch -arm64 "$BIN" --help 2>&1 \
            | grep -E -i \
            'display-driver|rendering-driver|metal|vulkan|opengl|forward_plus|compatibility' \
            || true

      - name: Real graphical launch
        shell: bash
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/demo/UnderThePool.app"

          EXEC="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Contents/Info.plist"
          )"

          BIN="$APP/Contents/MacOS/$EXEC"

          LOG="$RUNNER_TEMP/game.log"
          STDOUT="$RUNNER_TEMP/stdout.log"

          echo "===== START NORMAL GRAPHICAL GAME ====="

          set +e

          arch -arm64 "$BIN" \
            --verbose \
            --quit-after 180 \
            --log-file "$LOG" \
            >"$STDOUT" 2>&1 &

          PID=$!

          FINISHED=0
          RC=0

          for i in $(seq 1 40); do
            if ! kill -0 "$PID" 2>/dev/null; then
              wait "$PID"
              RC=$?
              FINISHED=1
              break
            fi

            sleep 1
          done

          if [[ "$FINISHED" -eq 0 ]]; then
            echo "ERROR: graphical process did not exit within 40 seconds."
            kill -TERM "$PID" 2>/dev/null || true
            sleep 2
            kill -KILL "$PID" 2>/dev/null || true
            RC=124
          fi

          set -e

          echo
          echo "===== STDOUT ====="
          cat "$STDOUT" || true

          echo
          echo "===== GODOT LOG ====="
          cat "$LOG" || true

          echo
          echo "===== RENDERER LINES ====="
          grep -E -i \
            'metal|vulkan|molten|rendering|renderer|display|gpu|device' \
            "$STDOUT" "$LOG" 2>/dev/null || true

          echo
          echo "===== EXIT CODE ====="
          echo "$RC"

          echo
          echo "===== RECENT CRASH REPORTS ====="

          find "$HOME/Library/Logs/DiagnosticReports" \
            -type f \
            -mmin -10 \
            \( -name '*.ips' -o -name '*.crash' \) \
            -print 2>/dev/null || true

          if [[ "$RC" -ne 0 ]]; then
            exit "$RC"
          fi

          echo
          echo "PASS: normal graphical ARM64 launch succeeded."
